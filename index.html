<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German A2 Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>German Vocabulary</h1>
        
        <!-- Category Selector -->
        <div class="category-selector">
            <select id="unit-select">
                <option value="all">All Units</option>
                <!-- The JavaScript will automatically add your categories here -->
            </select>
        </div>
        
        <div class="flashcard" id="card">
            <div class="front" id="card-front">
                Loading...
            </div>
            <div class="back" id="card-back">
                </div>
        </div>

        <div class="controls">
            <button id="prev-btn">Previous</button>
            <button id="flip-btn">Flip Card</button>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
