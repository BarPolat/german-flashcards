<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>German Vocabulary</h1>
        
<!-- Controls & Settings -->
        <div class="settings-panel" style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center; justify-content: center;">
            <select id="unit-select" style="flex: 1;">
                <option value="all">All Units</option>
                <!-- JavaScript adds categories here -->
            </select>
            
            <label style="color: #e0e0e0; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <input type="checkbox" id="reverse-mode"> Reverse Mode
            </label>
        </div>
        
        
        <div class="flashcard" id="card">
            <div class="front" id="card-front">
                Loading...
            </div>
            <div class="back" id="card-back">
                </div>
        </div>

        <div class="controls">
            <button id="prev-btn">Previous</button>
            <button id="flip-btn">Flip Card</button>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
